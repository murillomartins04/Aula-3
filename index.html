<!DOCTYPE html>
<html lang="pr-br">

    <head>
        <title>Recrutamento Online</title>
        <meta charset=""UTF-8">
    </head>

<body>
    <header>
        <h1>Recrutamento Online</h1>
    </header>
    <main>
        <section>
            <h2>Cadastre seu currículo</h2>
            <form action="#" method="get" >
                <p>Preencha o formulario para se candidatar à vaga</p>
                <fieldset> 
                
                    <legend>Dados pessoais</legend>

                    <div>
                        <label for="nome_id">Nome completo</label>
                        <input id="nome_" name="nome" type="text">
                    </div>

                    <div>
                        <label for="telefone_id">Telefone :</label>
                        <input id="telefone_id" name="telefone" type="tel"
                    </div>
                                        <div>
                        <label for="email_id">email :</label>
                        <input id="email_id" name="email" type="email"
                    </div>

                                  <div>
                        <label for="data_nasc_id">Data de nascimento:</label>
                        <input id="data_nasc_id" name="data_nasc" type="data"
                    </div>

                </fieldset>
                
                <fieldset>
                    <legend>Endereço</legend>
                    <div>
                        <label for="logradouro_id">logradouro :</label>
                        <input id="logradouro_id" name="logradouro" type="text"
                    </div>
                    <div> 
                        <Label for="cidade_id">Cidade:</Label>
                    <input id="cidade_id" name="Cidade" type="text">
                </div>
                <div> 
                        <Label for="numero_id">Número:</Label>
                    <input id="numero_id" name="Número" type="text">
                </div>
            </fieldset>
            <fieldset>
                <legend>Biografia</legend>
                <div>
                    <label for="resumo_id">Fale sobre voçê</label>
                    <textarea id="resumo_id"
                              name="resumo"
                              rows="10"
                              cols="50">
                        </textarea>
                </div>
            </fieldset>
            <fieldset>
                <legend>nível pretendido</legend>
                <div>
                    <input id="estagiario_id"
                           name="nivel"
                           type="radio"
                           value="stagiario">
                </div>
                <div>
                    <input id ="junior"
                           name="nivel"
                           type="radio"
                           value="junior">
                           <label for="junior_id">Júnior</label>
                    ></div>
            </fieldset>
            <fieldset>
                <legend>Tecnologias</legend>
                <div>
                    <input id="tec_html_id"
                           name="Tecnologia"
                           type="checkbox"
                           value="html">
                </div><div>
                    <input id="tec_css_id"
                           name="Tecnologia"
                           type="checkbox"
                           value="css">
                </div>
                <div>
                    <input id="tec_js_id"
                           name="Tecnologia"
                           type="checkbox"
                           value="js">
                           <label for=tec_js_id>"JavaScript"</label>
                </div>
            </fieldset>
            <fieldset>
                <legend>Grau de instituição</legend>
                <div>
                    <label for="escolaridade_id">Escolaridade</label>
                    <select id="escolaridade_id" name="escolaridade">
                        <option value="medio">Ensino medio</option>
                        <option value="graduado">Graduaçãp</option>
                        <option value="pos">Pós-graduação</option>
                    </select>
                </div>

            </fieldset>
        <fieldset>
            <div>
                <button> type="reset">Limpar Dados </button>
                <button> type="submit">Enviar candidatura</button>
                </button>
            </div>
            </form>
        </section>
    </main>
</body></html>
